name: SVLT

settings:
  base:
    SWIFT_VERSION: 6.0

targets:
  VaultCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultCore

  VaultCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultCoreTests
    dependencies:
      - target: VaultCore

  VaultAuthorization:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultAuthorization

  VaultExecution:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultExecution
    dependencies:
      - target: VaultCore
      - target: VaultAuthorization

  VaultService:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultService
    dependencies:
      - target: VaultCore
      - target: VaultAuthorization
      - target: VaultIPC
      - target: VaultExecution

  VaultIPC:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultIPC
    dependencies:
      - target: VaultCore
      - target: VaultExecution

  AgentSecretVaultApp:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Sources/AgentSecretVaultApp
        excludes:
          - AgentSecretVaultApp.swift
    dependencies:
      - target: VaultCore
      - target: VaultAuthorization
      - target: VaultIPC
      - target: VaultService

  SVLTAgent:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    productName: SVLTAgent
    settings:
      base:
        PRODUCT_NAME: SVLTAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.agent-secret-vault.SVLT.agent
    sources:
      - Sources/SVLTAgent
    dependencies:
      - target: VaultCore
      - target: VaultAuthorization
      - target: VaultExecution
      - target: VaultIPC
      - target: VaultService

  AgentSecretVault:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    productName: SVLT
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: SVLT
        PRODUCT_BUNDLE_IDENTIFIER: com.agent-secret-vault.SVLT
    sources:
      - Sources/AgentSecretVaultApp/AgentSecretVaultApp.swift
      - AppAssets/Assets.xcassets
      - path: Config/com.agent-secret-vault.SVLT.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.15"
        CFBundleVersion: "15"
    dependencies:
      - target: AgentSecretVaultApp
      - target: VaultIPC
      - target: VaultExecution
      - target: VaultCore
      - target: VaultAuthorization
      - target: VaultService
      - target: SVLTAgent
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables

  VaultAuthorizationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultAuthorizationTests
    dependencies:
      - target: VaultAuthorization
      - target: VaultCore
      - target: AgentSecretVaultApp
      - target: VaultService
      - target: VaultIPC

  VaultExecutionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultExecutionTests
    dependencies:
      - target: VaultExecution
      - target: VaultCore
      - target: VaultAuthorization

  VaultIPCTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultIPCTests
    dependencies:
      - target: VaultIPC
      - target: VaultCore
      - target: VaultExecution

  LeakTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/LeakTests

schemes:
  VaultCore:
    build:
      targets:
        VaultCore: all
        VaultCoreTests:
          - test
    test:
      targets:
        - VaultCoreTests

  VaultAuthorization:
    build:
      targets:
        VaultAuthorization: all
        VaultService: all
        AgentSecretVaultApp: all
        VaultAuthorizationTests:
          - test
    test:
      targets:
        - VaultAuthorizationTests

  AgentSecretVault:
    build:
      targets:
        AgentSecretVault: all
        VaultService: all
        SVLTAgent: all
        VaultCoreTests:
          - test
        VaultAuthorizationTests:
          - test
        VaultIPCTests:
          - test
        VaultExecutionTests:
          - test
        LeakTests:
          - test
    test:
      targets:
        - VaultCoreTests
        - VaultAuthorizationTests
        - VaultIPCTests
        - VaultExecutionTests
        - LeakTests

  VaultExecution:
    build:
      targets:
        VaultExecution: all
        VaultExecutionTests:
          - test
    test:
      targets:
        - VaultExecutionTests

  VaultIPC:
    build:
      targets:
        VaultIPC: all
        VaultIPCTests:
          - test
    test:
      targets:
        - VaultIPCTests
