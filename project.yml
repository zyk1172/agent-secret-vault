name: SVLT

settings:
  base:
    SWIFT_VERSION: 6.0

targets:
  VaultCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultCore

  VaultCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultCoreTests
    dependencies:
      - target: VaultCore

  VaultAuthorization:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultAuthorization

  VaultExecution:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultExecution
    dependencies:
      - target: VaultCore
      - target: VaultAuthorization

  VaultIPC:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources/VaultIPC
    dependencies:
      - target: VaultCore
      - target: VaultExecution

  AgentSecretVaultApp:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Sources/AgentSecretVaultApp
        excludes:
          - AgentSecretVaultApp.swift
    dependencies:
      - target: VaultCore
      - target: VaultAuthorization
      - target: VaultIPC

  AgentSecretVault:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    productName: SVLT
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: SVLT
    sources:
      - Sources/AgentSecretVaultApp/AgentSecretVaultApp.swift
      - AppAssets/Assets.xcassets
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: 0.1.14
        CFBundleVersion: 14
    dependencies:
      - target: AgentSecretVaultApp
      - target: VaultIPC
      - target: VaultExecution
      - target: VaultCore
      - target: VaultAuthorization

  VaultAuthorizationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultAuthorizationTests
    dependencies:
      - target: VaultAuthorization
      - target: VaultCore
      - target: AgentSecretVaultApp
      - target: VaultIPC

  VaultExecutionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultExecutionTests
    dependencies:
      - target: VaultExecution
      - target: VaultCore
      - target: VaultAuthorization

  VaultIPCTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/VaultIPCTests
    dependencies:
      - target: VaultIPC
      - target: VaultCore
      - target: VaultExecution

  LeakTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests/LeakTests

schemes:
  VaultCore:
    build:
      targets:
        VaultCore: all
        VaultCoreTests:
          - test
    test:
      targets:
        - VaultCoreTests

  VaultAuthorization:
    build:
      targets:
        VaultAuthorization: all
        AgentSecretVaultApp: all
        VaultAuthorizationTests:
          - test
    test:
      targets:
        - VaultAuthorizationTests

  AgentSecretVault:
    build:
      targets:
        AgentSecretVault: all
        VaultCoreTests:
          - test
        VaultAuthorizationTests:
          - test
        VaultIPCTests:
          - test
        LeakTests:
          - test
    test:
      targets:
        - VaultCoreTests
        - VaultAuthorizationTests
        - VaultIPCTests
        - LeakTests

  VaultExecution:
    build:
      targets:
        VaultExecution: all
        VaultExecutionTests:
          - test
    test:
      targets:
        - VaultExecutionTests

  VaultIPC:
    build:
      targets:
        VaultIPC: all
        VaultIPCTests:
          - test
    test:
      targets:
        - VaultIPCTests
